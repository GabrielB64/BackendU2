{% extends "base.html" %}
{% block title %}Productos | Empresa{% endblock %}
{% block content %}
<div class="container py-5">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Mis productos</h1><p class="text-body-secondary">Gestiona los productos publicados por tu empresa.</p></div><a href="/company/products/new/" class="btn btn-primary">Nuevo producto</a></div>
<div id="products" class="row g-4"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadProducts(){
 const token=localStorage.getItem("access_token"); if(!token||localStorage.getItem("user_type")!=="COMPANY"){location.href="/login/company/";return;}
 const r=await fetch("/api/company/products/",{headers:{"Authorization":`Bearer ${token}`}});
 const data=await r.json(); if(!r.ok){location.href="/login/company/";return;}
 const box=document.getElementById("products");
 box.innerHTML=data.map(p=>`<div class="col-md-6 col-lg-4"><div class="card h-100 shadow-sm"><img src="${p.image}" class="card-img-top product-image"><div class="card-body"><h5>${escapeHtml(p.name)}</h5><p>$${Number(p.price).toLocaleString("es-CL")}</p><p>Stock: ${p.stock} | Disponible: ${p.available_stock}</p><span class="badge ${p.active?"text-bg-success":"text-bg-secondary"}">${p.active?"Activo":"Inactivo"}</span><div class="mt-3"><a class="btn btn-outline-primary btn-sm" href="/company/products/new/?edit=${p.id}">Editar</a><button class="btn btn-outline-danger btn-sm" onclick="disableProduct(${p.id})">Desactivar</button></div></div></div></div>`).join("");
}
function escapeHtml(v){const x=document.createElement("div");x.textContent=v;return x.innerHTML;}
async function disableProduct(id){
 const token=localStorage.getItem("access_token");
 const r=await fetch(`/api/company/products/${id}/`,{method:"DELETE",headers:{"Authorization":`Bearer ${token}`}});
 if(r.ok){loadProducts();} else {const d=await r.json();showToast(d.detail,"danger");}
}
loadProducts();
</script>
{% endblock %}
