{% extends "base.html" %}
{% block title %}Login empresa | MiTienda{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card shadow"><div class="card-body p-4">
<div class="text-center mb-4"><i class="bi bi-building display-3"></i><h2 class="mt-3">Portal de empresas</h2><p class="text-body-secondary">Administra productos y ventas.</p></div>
<form id="login-form">
<div class="mb-3"><label class="form-label">RUT de empresa</label><input id="rut" class="form-control" placeholder="76.123.456-7" required></div>
<div class="mb-3"><label class="form-label">Contraseña</label><input id="password" type="password" class="form-control" required></div>
<div id="error" class="alert alert-danger d-none"></div>
<button class="btn btn-primary w-100">Entrar al portal</button>
</form>
<hr><div class="text-center"><a href="/register/company/">Registrar empresa</a><br><a href="/login/client/">Acceso para clientes</a></div>
</div></div></div></div></div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const response=await fetch("/api/auth/company/token/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rut:document.getElementById("rut").value,password:document.getElementById("password").value})});
    const data=await response.json();
    if(!response.ok){const el=document.getElementById("error");el.textContent=data.detail||"Credenciales inválidas.";el.classList.remove("d-none");return;}
    localStorage.setItem("access_token",data.access);localStorage.setItem("refresh_token",data.refresh);localStorage.setItem("user_type","COMPANY");
    window.location.href="/company/dashboard/";
});
</script>
{% endblock %}
